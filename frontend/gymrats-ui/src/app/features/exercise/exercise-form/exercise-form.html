<form [formGroup]="exerciseForm" (ngSubmit)="onSubmit()">
    <h2 class="form-title">Übung</h2>

    <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Muskelgruppe</mat-label>
        <mat-select formControlName="muscleGroup">
            @for (muscleGroup of muscleGroups; track muscleGroup) {
            <mat-option [value]="muscleGroup.value">{{ muscleGroup.label }}</mat-option>
            }
        </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Beschreibung</mat-label>
        <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

     <button mat-flat-button [disabled]="saving()" type="submit">
        Speichern
    </button>
</form>
