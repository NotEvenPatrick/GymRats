@if (loading()) {
<mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
} @else if (loadError(); as errorMessage) {
<p role="alert">{{ errorMessage }}</p>
} @else {
<table mat-table [dataSource]="exercises()">
    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let exercise">{{ exercise.name }}</td>
    </ng-container>

    <ng-container matColumnDef="muscleGroup">
        <th mat-header-cell *matHeaderCellDef>Muskelgruppe</th>
        <td mat-cell *matCellDef="let exercise">{{ exercise.muscleGroup | muscleGroupLabel }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Beschreibung</th>
        <td mat-cell *matCellDef="let exercise">{{ exercise.description }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Aktionen</th>
        <td mat-cell *matCellDef="let exercise">
                <button mat-button color="accent" (click)="openExerciseDialog(exercise)">Bearbeiten</button>
                <button mat-button color="warn" (click)="deleteExercise(exercise.id)">Löschen</button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length">Noch keine Übungen vorhanden.</td>
    </tr>
</table>
}
<button mat-raised-button color="primary" (click)="openExerciseDialog()">Übung hinzufügen</button>
