<div>
    <h2>{{ data.title }}</h2>
    <mat-dialog-content>
        <p>{{ data.message }}</p>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>{{ data.cancelButtonText }}</button>
        <button mat-button [mat-dialog-close]="true">{{ data.confirmButtonText }}</button>
    </mat-dialog-actions>
</div>
