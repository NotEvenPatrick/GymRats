# Separate in-memory database for E2E tests
spring.datasource.url=jdbc:h2:mem:gymrats-e2e;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Recreate the schema for every backend process
spring.jpa.hibernate.ddl-auto=create-drop

# H2 console is not needed for E2E tests
spring.h2.console.enabled=false

# Only accessible from the local machine
server.address=127.0.0.1